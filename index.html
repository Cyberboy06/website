<style>
/* Art direction: Österreichische Anwaltskanzlei trifft modernes SaaS
   Palette: Tiefes Navy + warmes Off-White, Gold-Akzent für Prestige
   Typography: Instrument Serif (Display) + DM Sans (Body)
   Density: Generous – editorial, vertrauenswürdig */

/* === DESIGN TOKENS === */
:root, [data-theme="light"] {
  --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
  --text-sm:   clamp(0.875rem, 0.8rem  + 0.35vw, 1rem);
  --text-base: clamp(1rem,     0.95rem + 0.25vw, 1.125rem);
  --text-lg:   clamp(1.125rem, 1rem    + 0.75vw, 1.5rem);
  --text-xl:   clamp(1.5rem,   1.2rem  + 1.25vw, 2.25rem);
  --text-2xl:  clamp(2rem,     1.2rem  + 2.5vw,  3.5rem);
  --text-3xl:  clamp(2.5rem,   1rem    + 4vw,    5rem);

  --space-1: 0.25rem; --space-2: 0.5rem;  --space-3: 0.75rem;
  --space-4: 1rem;    --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem;    --space-10: 2.5rem; --space-12: 3rem;
  --space-16: 4rem;   --space-20: 5rem;   --space-24: 6rem;
  --space-32: 8rem;

  --color-bg:               #f8f7f3;
  --color-surface:          #faf9f6;
  --color-surface-2:        #fdfcfa;
  --color-surface-offset:   #f2efe9;
  --color-surface-offset-2: #ebe7e0;
  --color-surface-dynamic:  #e4e0d8;
  --color-divider:          #dbd7cf;
  --color-border:           #d2cec5;

  --color-text:             #1a1814;
  --color-text-muted:       #6b6860;
  --color-text-faint:       #aaa89f;
  --color-text-inverse:     #f8f7f3;

  --color-primary:          #1a2f5e;
  --color-primary-hover:    #142450;
  --color-primary-active:   #0e1a3e;
  --color-primary-highlight:#d0d6e8;

  --color-gold:             #b8860b;
  --color-gold-hover:       #9a6f08;
  --color-gold-light:       #f5edd6;

  --color-success:          #2d6a1f;
  --color-success-highlight:#d4e8ce;
  --color-error:            #9b1c2e;
  --color-error-highlight:  #f0d0d5;
  --color-warning:          #8a4a00;
  --color-warning-highlight:#f5e4cc;

  --radius-sm:   0.375rem;
  --radius-md:   0.5rem;
  --radius-lg:   0.75rem;
  --radius-xl:   1rem;
  --radius-2xl:  1.5rem;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 2px oklch(0.15 0.02 260 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.15 0.02 260 / 0.09);
  --shadow-lg: 0 12px 32px oklch(0.15 0.02 260 / 0.13);
  --shadow-xl: 0 24px 64px oklch(0.15 0.02 260 / 0.16);

  --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);

  --content-narrow:  640px;
  --content-default: 960px;
  --content-wide:   1200px;

  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body:    'DM Sans', 'Helvetica Neue', sans-serif;
}

[data-theme="dark"] {
  --color-bg:               #13120f;
  --color-surface:          #181714;
  --color-surface-2:        #1c1b18;
  --color-surface-offset:   #1a1916;
  --color-surface-offset-2: #1f1e1b;
  --color-surface-dynamic:  #2d2c2a;
  --color-divider:          #252420;
  --color-border:           #302f2b;
  --color-text:             #e8e6e2;
  --color-text-muted:       #908e88;
  --color-text-faint:       #5a5957;
  --color-text-inverse:     #13120f;
  --color-primary:          #7b96d4;
  --color-primary-hover:    #9aaede;
  --color-primary-active:   #b8c7e8;
  --color-primary-highlight:#1e2840;
  --color-gold:             #d4a017;
  --color-gold-hover:       #e8b420;
  --color-gold-light:       #2a2210;
  --color-success:          #5aaa42;
  --color-success-highlight:#1a2e16;
  --color-error:            #e05470;
  --color-error-highlight:  #2a1018;
  --color-warning:          #d4820a;
  --color-warning-highlight:#2a1a08;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.25);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.35);
  --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.45);
  --shadow-xl: 0 24px 64px oklch(0 0 0 / 0.55);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --color-bg:#13120f;--color-surface:#181714;--color-surface-2:#1c1b18;
    --color-surface-offset:#1a1916;--color-surface-offset-2:#1f1e1b;
    --color-surface-dynamic:#2d2c2a;--color-divider:#252420;--color-border:#302f2b;
    --color-text:#e8e6e2;--color-text-muted:#908e88;--color-text-faint:#5a5957;
    --color-text-inverse:#13120f;--color-primary:#7b96d4;--color-primary-hover:#9aaede;
    --color-primary-active:#b8c7e8;--color-primary-highlight:#1e2840;
    --color-gold:#d4a017;--color-gold-hover:#e8b420;--color-gold-light:#2a2210;
    --shadow-sm:0 1px 2px oklch(0 0 0/.25);--shadow-md:0 4px 12px oklch(0 0 0/.35);
    --shadow-lg:0 12px 32px oklch(0 0 0/.45);--shadow-xl:0 24px 64px oklch(0 0 0/.55);
  }
}

/* === BASE === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  scroll-behavior: smooth;
  scroll-padding-top: var(--space-20);
}
body {
  min-height: 100dvh;
  line-height: 1.6;
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-text);
  background-color: var(--color-bg);
}
img, picture, video, canvas, svg { display: block; max-width: 100%; height: auto; }
ul[role="list"], ol[role="list"] { list-style: none; }
input, button, textarea, select { font: inherit; color: inherit; }
h1,h2,h3,h4,h5,h6 { text-wrap: balance; line-height: 1.15; }
p, li, figcaption { text-wrap: pretty; max-width: 72ch; }
::selection { background: oklch(from var(--color-primary) l c h / 0.2); color: var(--color-text); }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
button { cursor: pointer; background: none; border: none; }
a, button, [role="button"], input, textarea, select {
  transition: color var(--transition-interactive), background var(--transition-interactive), border-color var(--transition-interactive), box-shadow var(--transition-interactive);
}
.sr-only { position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0; }

/* === LAYOUT === */
.container { max-width: var(--content-wide); margin-inline: auto; padding-inline: var(--space-6); }
.container--default { max-width: var(--content-default); margin-inline: auto; padding-inline: var(--space-6); }
.container--narrow { max-width: var(--content-narrow); margin-inline: auto; padding-inline: var(--space-6); }

/* === BUTTONS === */
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-6);
  font-family: var(--font-body); font-size: var(--text-sm); font-weight: 500;
  border-radius: var(--radius-md); border: 1px solid transparent;
  text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: all var(--transition-interactive);
}
.btn-primary { background: var(--color-primary); color: var(--color-text-inverse); border-color: var(--color-primary); }
.btn-primary:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-primary:active { transform: translateY(0); box-shadow: none; }
.btn-outline { background: transparent; color: var(--color-primary); border-color: oklch(from var(--color-primary) l c h / 0.4); }
.btn-outline:hover { background: var(--color-primary-highlight); border-color: var(--color-primary); }
.btn-ghost { background: transparent; color: var(--color-text-muted); border-color: transparent; }
.btn-ghost:hover { color: var(--color-text); background: var(--color-surface-offset); }
.btn-inverse { background: var(--color-text-inverse); color: var(--color-primary); border-color: var(--color-text-inverse); }
.btn-inverse:hover { background: oklch(from var(--color-text-inverse) l c h / 0.9); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-lg { padding: var(--space-4) var(--space-8); font-size: var(--text-base); }
.btn-sm { padding: var(--space-2) var(--space-4); font-size: var(--text-xs); }

/* === NAV === */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: oklch(from var(--color-bg) l c h / 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--color-divider);
}
.nav__inner {
  display: flex; align-items: center; justify-content: space-between;
  padding-block: var(--space-4);
}
.nav__logo {
  display: flex; align-items: center; gap: var(--space-3);
  text-decoration: none; color: var(--color-text);
}
.nav__logo-mark { width: 36px; height: 36px; flex-shrink: 0; }
.nav__logo-text { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 400; letter-spacing: -0.01em; }
.nav__links { display: flex; align-items: center; gap: var(--space-8); list-style: none; }
.nav__links a {
  font-size: var(--text-sm); color: var(--color-text-muted); text-decoration: none; font-weight: 450;
  position: relative; padding-bottom: 2px;
}
.nav__links a::after {
  content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 2px;
  background: var(--color-primary); border-radius: var(--radius-full);
  transition: width var(--transition-interactive);
}
.nav__links a:hover { color: var(--color-text); }
.nav__links a:hover::after, .nav__links a.active::after { width: 100%; }
.nav__links a.active { color: var(--color-text); font-weight: 500; }
.nav__actions { display: flex; align-items: center; gap: var(--space-3); }
.nav__toggle {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md); color: var(--color-text-muted);
}
.nav__toggle:hover { color: var(--color-text); background: var(--color-surface-offset); }
.nav__hamburger {
  display: none; width: 40px; height: 40px;
  align-items: center; justify-content: center;
  border-radius: var(--radius-md); color: var(--color-text-muted);
}
.nav__hamburger:hover { color: var(--color-text); background: var(--color-surface-offset); }

/* Mobile Nav Drawer */
.nav__mobile {
  display: none;
  position: fixed; inset: 0; z-index: 200;
}
.nav__mobile.open { display: flex; }
.nav__mobile-backdrop {
  position: absolute; inset: 0;
  background: oklch(0.1 0.01 260 / 0.6);
  backdrop-filter: blur(4px);
}
.nav__mobile-drawer {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(320px, 90vw);
  background: var(--color-surface);
  box-shadow: var(--shadow-xl);
  display: flex; flex-direction: column;
  padding: var(--space-6);
  overflow-y: auto;
}
.nav__mobile-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-8);
}
.nav__mobile-close {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md); color: var(--color-text-muted);
}
.nav__mobile-close:hover { background: var(--color-surface-offset); color: var(--color-text); }
.nav__mobile-links { list-style: none; display: flex; flex-direction: column; gap: var(--space-1); }
.nav__mobile-links a {
  display: block; padding: var(--space-3) var(--space-4);
  font-size: var(--text-base); color: var(--color-text-muted);
  text-decoration: none; border-radius: var(--radius-md);
}
.nav__mobile-links a:hover { background: var(--color-surface-offset); color: var(--color-text); }
.nav__mobile-actions { margin-top: var(--space-8); display: flex; flex-direction: column; gap: var(--space-3); }
.nav__mobile-actions .btn { justify-content: center; }

@media (max-width: 768px) {
  .nav__links { display: none; }
  .nav__hamburger { display: flex; }
  .nav__actions .btn-outline { display: none; }
  .nav__actions .btn-primary { display: none; }
}

/* === HERO === */
.hero {
  padding-block: clamp(var(--space-16), 10vw, var(--space-32));
  overflow: hidden; position: relative;
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 50% at 50% -10%, oklch(from var(--color-primary) l c h / 0.06) 0%, transparent 70%);
  pointer-events: none;
}
.hero__inner {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: var(--space-16); align-items: center;
}
.hero__eyebrow {
  display: inline-flex; align-items: center; gap: var(--space-2);
  font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--color-primary); background: var(--color-primary-highlight);
  padding: var(--space-1) var(--space-3); border-radius: var(--radius-full);
  margin-bottom: var(--space-6);
}
.hero__heading {
  font-family: var(--font-display); font-size: var(--text-3xl);
  font-weight: 400; line-height: 1.05; letter-spacing: -0.02em;
  color: var(--color-text); margin-bottom: var(--space-6);
}
.hero__heading em { font-style: italic; color: var(--color-primary); }
.hero__sub {
  font-size: var(--text-lg); color: var(--color-text-muted);
  line-height: 1.6; max-width: 52ch; margin-bottom: var(--space-10);
}
.hero__actions { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.hero__trust {
  display: flex; align-items: center; gap: var(--space-3);
  margin-top: var(--space-8); font-size: var(--text-xs); color: var(--color-text-muted);
}
.hero__trust-dot { width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-success); flex-shrink: 0; }
.hero__visual { position: relative; }
.hero__mockup {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-2xl); overflow: hidden; box-shadow: var(--shadow-xl);
}
.hero__mockup-bar {
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-4);
  background: var(--color-surface-offset); border-bottom: 1px solid var(--color-divider);
}
.hero__mockup-dot { width: 10px; height: 10px; border-radius: var(--radius-full); }
.hero__mockup-body { padding: var(--space-5); }
.hero__case-list { display: flex; flex-direction: column; gap: var(--space-3); }
.hero__case-item {
  background: var(--color-surface-2); border: 1px solid var(--color-divider);
  border-radius: var(--radius-lg); padding: var(--space-4);
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4);
}
.hero__case-title { font-size: var(--text-sm); font-weight: 600; color: var(--color-text); margin-bottom: var(--space-1); }
.hero__case-meta { font-size: var(--text-xs); color: var(--color-text-muted); }
.hero__case-badge {
  font-size: var(--text-xs); font-weight: 500; padding: 2px var(--space-2);
  border-radius: var(--radius-full); white-space: nowrap; flex-shrink: 0;
}
.status--active { background: var(--color-success-highlight); color: var(--color-success); }
.status--review { background: var(--color-warning-highlight); color: var(--color-warning); }
.status--done   { background: var(--color-surface-dynamic); color: var(--color-text-muted); }
[data-theme="dark"] .status--active { background: #1e3010; color: #6daa45; }
[data-theme="dark"] .status--review { background: #2a1a08; color: #d4820a; }
.hero__ai-bubble {
  margin-top: var(--space-3); background: var(--color-primary-highlight);
  border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4);
  font-size: var(--text-xs); color: var(--color-text); line-height: 1.5;
}
.hero__ai-label {
  font-size: var(--text-xs); font-weight: 600; color: var(--color-primary);
  margin-bottom: var(--space-1); text-transform: uppercase; letter-spacing: 0.06em;
}
@media (max-width: 900px) {
  .hero__inner { grid-template-columns: 1fr; }
  .hero__visual { display: none; }
}

/* === STATS STRIP === */
.stats {
  padding-block: var(--space-12);
  border-top: 1px solid var(--color-divider);
  border-bottom: 1px solid var(--color-divider);
  background: var(--color-surface);
}
.stats__grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: var(--space-8); text-align: center;
}
.stat__number {
  font-family: var(--font-display); font-size: var(--text-2xl);
  color: var(--color-primary); font-weight: 400; line-height: 1;
  margin-bottom: var(--space-2); letter-spacing: -0.02em;
}
.stat__label { font-size: var(--text-sm); color: var(--color-text-muted); }
@media (max-width: 640px) { .stats__grid { grid-template-columns: repeat(2, 1fr); } }

/* === LOGOS === */
.logos {
  padding-block: var(--space-12);
  border-bottom: 1px solid var(--color-divider);
}
.logos__label {
  text-align: center; font-size: var(--text-xs);
  color: var(--color-text-faint); text-transform: uppercase; letter-spacing: 0.1em;
  margin-bottom: var(--space-8);
}
.logos__row {
  display: flex; align-items: center; justify-content: center;
  gap: var(--space-12); flex-wrap: wrap;
}
.logos__item { font-family: var(--font-display); font-size: var(--text-lg); color: var(--color-text-faint); font-style: italic; opacity: 0.6; }

/* === SECTION COMMONS === */
.section { padding-block: clamp(var(--space-16), 8vw, var(--space-24)); }
.section--alt { background: var(--color-surface); }
.section--dark { background: var(--color-primary); color: var(--color-text-inverse); }
.section-eyebrow { font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-primary); margin-bottom: var(--space-4); }
.section--dark .section-eyebrow { color: oklch(from var(--color-text-inverse) l c h / 0.6); }
.section-heading { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 400; line-height: 1.1; letter-spacing: -0.02em; color: var(--color-text); margin-bottom: var(--space-4); }
.section--dark .section-heading { color: var(--color-text-inverse); }
.section-sub { font-size: var(--text-base); color: var(--color-text-muted); max-width: 56ch; line-height: 1.7; }
.section--dark .section-sub { color: oklch(from var(--color-text-inverse) l c h / 0.7); }
.section-header { margin-bottom: var(--space-12); }
.section-header--center { text-align: center; }
.section-header--center .section-sub { margin-inline: auto; }

/* === FEATURES === */
.features__grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }
.feature-card {
  padding: var(--space-8); background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-xl);
  transition: box-shadow var(--transition-interactive), transform var(--transition-interactive);
}
.feature-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.feature-card--large {
  grid-column: span 2;
  display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); align-items: center;
}
.feature-card__icon { width: 40px; height: 40px; margin-bottom: var(--space-5); color: var(--color-primary); }
.feature-card__title { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 400; color: var(--color-text); margin-bottom: var(--space-3); }
.feature-card__body { font-size: var(--text-base); color: var(--color-text-muted); line-height: 1.7; }
.feature-card__demo { background: var(--color-surface-offset); border-radius: calc(var(--radius-xl) - var(--space-4)); padding: var(--space-5); min-height: 160px; }
@media (max-width: 768px) {
  .features__grid { grid-template-columns: 1fr; }
  .feature-card--large { grid-column: span 1; grid-template-columns: 1fr; }
}

/* === CHAT DEMO === */
.chat-demo { display: flex; flex-direction: column; gap: var(--space-3); }
.chat-msg {
  max-width: 85%; padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-lg); font-size: var(--text-xs); line-height: 1.6;
}
.chat-msg--user { align-self: flex-end; background: var(--color-primary); color: var(--color-text-inverse); border-bottom-right-radius: var(--radius-sm); }
.chat-msg--james { align-self: flex-start; background: var(--color-surface-2); border: 1px solid var(--color-divider); border-bottom-left-radius: var(--radius-sm); }
.chat-msg--james strong { color: var(--color-primary); }

/* === HOW IT WORKS === */
.steps {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: var(--space-8); counter-reset: steps;
}
.step { position: relative; padding-top: var(--space-8); }
.step::before {
  counter-increment: steps;
  content: counter(steps, decimal-leading-zero);
  display: block; font-family: var(--font-display); font-size: var(--text-2xl);
  color: var(--color-primary-highlight); line-height: 1;
  margin-bottom: var(--space-4); font-style: italic;
}
.step__title { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 400; color: var(--color-text); margin-bottom: var(--space-3); }
.step__body { font-size: var(--text-base); color: var(--color-text-muted); line-height: 1.7; }
@media (max-width: 768px) { .steps { grid-template-columns: 1fr; } }

/* === TESTIMONIALS === */
.testimonials__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-6); }
.testimonial {
  padding: var(--space-8); background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-xl);
  display: flex; flex-direction: column;
}
.testimonial__stars { display: flex; gap: var(--space-1); margin-bottom: var(--space-5); }
.testimonial__star { color: var(--color-gold); width: 16px; height: 16px; }
.testimonial__quote {
  font-family: var(--font-display); font-size: var(--text-base);
  font-style: italic; color: var(--color-text);
  line-height: 1.7; margin-bottom: var(--space-6); flex: 1;
}
.testimonial__quote::before { content: '\201E'; }
.testimonial__quote::after  { content: '\201C'; }
.testimonial__author { display: flex; align-items: center; gap: var(--space-3); }
.testimonial__avatar {
  width: 40px; height: 40px; border-radius: var(--radius-full);
  background: var(--color-primary-highlight);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: var(--text-base); color: var(--color-primary);
  font-style: italic; flex-shrink: 0;
}
.testimonial__name { font-size: var(--text-sm); font-weight: 600; color: var(--color-text); }
.testimonial__role { font-size: var(--text-xs); color: var(--color-text-muted); }
@media (max-width: 900px) { .testimonials__grid { grid-template-columns: 1fr; } }

/* === PRICING === */
.pricing__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-6); align-items: start; }
.pricing-card {
  background: var(--color-surface); border: 1px solid var(--color-divider);
  border-radius: var(--radius-xl); padding: var(--space-8); position: relative;
}
.pricing-card--featured {
  background: var(--color-primary); border-color: var(--color-primary);
  color: var(--color-text-inverse); transform: scale(1.03); box-shadow: var(--shadow-xl);
}
.pricing-card__badge {
  display: inline-block; font-size: var(--text-xs); font-weight: 600;
  padding: var(--space-1) var(--space-3); border-radius: var(--radius-full);
  background: var(--color-gold-light); color: var(--color-gold); margin-bottom: var(--space-4);
}
.pricing-card--featured .pricing-card__badge { background: oklch(from var(--color-text-inverse) l c h / 0.15); color: var(--color-text-inverse); }
.pricing-card__name { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 400; margin-bottom: var(--space-2); }
.pricing-card__price { font-size: var(--text-2xl); font-weight: 700; line-height: 1; margin-bottom: var(--space-1); letter-spacing: -0.02em; }
.pricing-card--featured .pricing-card__price { color: var(--color-text-inverse); }
.pricing-card__period { font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: var(--space-6); }
.pricing-card--featured .pricing-card__period { color: oklch(from var(--color-text-inverse) l c h / 0.65); }
.pricing-card__divider { height: 1px; background: var(--color-divider); margin-block: var(--space-6); }
.pricing-card--featured .pricing-card__divider { background: oklch(from var(--color-text-inverse) l c h / 0.2); }
.pricing-card__features { list-style: none; display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-8); }
.pricing-card__features li { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); }
.pricing-card__features li svg { flex-shrink: 0; width: 16px; height: 16px; color: var(--color-success); }
.pricing-card--featured .pricing-card__features li svg { color: oklch(from var(--color-text-inverse) l c h / 0.8); }
@media (max-width: 900px) {
  .pricing__grid { grid-template-columns: 1fr; }
  .pricing-card--featured { transform: none; }
}

/* === FAQ === */
.faq { display: flex; flex-direction: column; gap: var(--space-2); }
.faq-item { border: 1px solid var(--color-divider); border-radius: var(--radius-lg); overflow: hidden; }
.faq-item__trigger {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-5) var(--space-6); text-align: left;
  font-size: var(--text-base); font-weight: 500; color: var(--color-text);
  background: var(--color-surface);
  transition: background var(--transition-interactive);
}
.faq-item__trigger:hover { background: var(--color-surface-offset); }
.faq-item__icon { flex-shrink: 0; width: 20px; height: 20px; color: var(--color-text-muted); transition: transform 300ms cubic-bezier(0.16, 1, 0.3, 1); }
.faq-item.open .faq-item__icon { transform: rotate(45deg); }
.faq-item__body {
  max-height: 0; overflow: hidden; background: var(--color-surface);
  transition: max-height 350ms cubic-bezier(0.16, 1, 0.3, 1);
}
.faq-item.open .faq-item__body { max-height: 400px; }
.faq-item__body p { padding: 0 var(--space-6) var(--space-5); font-size: var(--text-base); color: var(--color-text-muted); line-height: 1.7; }

/* === CONTACT FORM === */
.contact-form {
  background: var(--color-surface); border: 1px solid var(--color-divider);
  border-radius: var(--radius-2xl); padding: clamp(var(--space-8), 5vw, var(--space-12));
  max-width: 640px; margin-inline: auto;
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.form-field { display: flex; flex-direction: column; gap: var(--space-2); }
.form-field--full { grid-column: span 2; }
.form-label { font-size: var(--text-sm); font-weight: 500; color: var(--color-text); }
.form-input, .form-select, .form-textarea {
  padding: var(--space-3) var(--space-4);
  background: var(--color-bg); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); font-size: var(--text-sm); color: var(--color-text);
  transition: border-color var(--transition-interactive), box-shadow var(--transition-interactive);
  width: 100%;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none; border-color: var(--color-primary);
  box-shadow: 0 0 0 3px oklch(from var(--color-primary) l c h / 0.12);
}
.form-textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
.form-select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right var(--space-3) center; background-size: 16px; padding-right: var(--space-10); }
.form-success {
  display: none; text-align: center; padding: var(--space-8);
}
.form-success-icon { width: 48px; height: 48px; background: var(--color-success-highlight); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-4); color: var(--color-success); }
.form-success h3 { font-family: var(--font-display); font-size: var(--text-xl); color: var(--color-text); margin-bottom: var(--space-2); }
.form-success p { font-size: var(--text-base); color: var(--color-text-muted); }
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .form-field--full { grid-column: span 1; } }

/* === CTA SECTION === */
.cta-section {
  padding-block: clamp(var(--space-16), 10vw, var(--space-32));
  text-align: center; position: relative; overflow: hidden;
}
